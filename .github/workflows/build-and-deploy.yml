name: Build and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    name: Sync and Deploy (${{ matrix.platform }})
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: PS1
            project_name: ps1data
          - platform: PS2
            project_name: ps2data

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run build script for ${{ matrix.platform }}
        run: node index.js ${{ matrix.platform }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ matrix.project_name }}
